<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Eroare SGBD</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .error-container { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; text-align: center; }
        .btn-home { margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="text-danger">Atenție!</h1>
        <hr>
        <p class="lead" th:text="${error}">Mesaj de eroare implicit.</p>
        <a href="/" class="btn btn-primary btn-home">Înapoi la Panou</a>
    </div>
</body>
</html>
